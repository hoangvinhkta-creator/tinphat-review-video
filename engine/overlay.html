<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================================
// Lớp đồ hoạ chồng lên video dọc 1080x1920. Dữ liệu do render.js nạp trước khi gọi init():
//   window.WD     = {words:[{w,s,e}], segs:[{text,s,e,w0,w1}]}   (build/words.json)
//   window.SCENES = [...]                                         (scenes.json của dự án)
//   window.CFG    = {brand, subtitles, duration, logo}             (project.json + assets/brand/brand.json)
// Hình chỉ phụ thuộc t (window.seek). Không dùng Math.random, Date, requestAnimationFrame.
// Mọi thành phần nằm trong SAFE; phụ đề (nếu bật) nằm trong SUB.
// =====================================================================================
const SAFE = {x0: 60, x1: 940, y0: 250, y1: 1250};
const SUB = {y0: 1250, y1: 1430};
const Q = new URLSearchParams(location.search);
const DEBUG = Q.get('safe') === '1';
let C = {navy: '#1b2a5e', red: '#d71920', yel: '#ffd23f', green: '#2aa46b', ink: '#16181d', grey: '#5a6378', card: 'rgba(255,255,255,0.94)', soft: '#e9edf6'};
const cv = document.getElementById('c'), g = cv.getContext('2d');

// ---------- tiện ích ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p, k = 1.9) => { p = clamp(p); const c3 = k + 1; return 1 + c3 * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2); };
const bounce = (p) => p <= 0 || p >= 1 ? 0 : Math.exp(-5 * p) * Math.sin(p * Math.PI * 3);
const clean = (s) => s.normalize('NFC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(size, w = 800, f = 'BVP') { g.font = `${w} ${size}px ${f}`; }
function measure(s, size, w = 800, f = 'BVP', ls = 0) { font(size, w, f); g.letterSpacing = ls + 'px'; const m = g.measureText(s).width; g.letterSpacing = '0px'; return m; }
function txt(s, x, y, size, color, o = {}) {
  font(size, o.w || 800, o.f || 'BVP'); g.textAlign = o.al || 'left'; g.textBaseline = 'alphabetic'; g.letterSpacing = (o.ls || 0) + 'px';
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = o.stroke; g.strokeStyle = o.sc || 'rgba(10,14,30,.9)'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y); g.letterSpacing = '0px';
}
function fit(s, size, maxW, w = 800) { let z = size; while (z > 20 && measure(s, z, w) > maxW) z -= 2; return z; }   // co chữ cho vừa
function card(x, y, w, h, o = {}) {
  g.save(); g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 28; g.shadowOffsetY = 10;
  rr(x, y, w, h, o.r ?? 26); g.fillStyle = o.fill || C.card; g.fill(); g.restore();
  if (o.bar !== false) { g.save(); rr(x, y, w, h, o.r ?? 26); g.clip(); g.fillStyle = o.bar || C.red; g.fillRect(x, y, 12, h); g.restore(); }
}
function pill(s, x, y, size, bg, fg) {
  const w = measure(s, size, 800, 'BVP', 1) + size * 1.1, h = size * 1.55;
  rr(x, y, w, h, h / 2); g.fillStyle = bg; g.fill(); txt(s, x + size * .55, y + h * .7, size, fg, {ls: 1}); return w;
}
function life(t, tin, tout, din = .42, dout = .28) {
  if (t < tin || t > tout + dout) return null;
  const pi = clamp((t - tin) / din), po = clamp((t - tout) / dout);
  return {a: Math.min(eOut(clamp(pi * 1.6)), 1 - po), s: back(pi) * (1 - .12 * eOut(po)), pi, po, k: t - tin};
}
function withL(L, cx, cy, fn) {
  if (!L || L.a <= 0) return;
  g.save(); g.globalAlpha *= L.a; g.translate(cx, cy); g.scale(L.s, L.s); g.translate(-cx, -cy); fn(); g.restore();
}
function popAt(t, t0, k = 2.6) { return back(clamp((t - t0) / .45), k); }   // hệ số phóng khi "nảy" tại t0

// ---------- thời gian theo lời đọc ----------
// spec: số giây | "từ" | "từ#2" (lần thứ 2) | "từ+0.3" / "từ-0.1" | "từ@end" (lúc đọc xong từ). Tìm từ mốc `after` trở đi.
function W() { return window.WD.words; }
function resolve(spec, after = 0) {
  if (spec === undefined || spec === null) return undefined;
  if (typeof spec === 'number') return spec;
  let m = String(spec).match(/^(.*?)(?:#(\d+))?(@end)?([+-]\d*\.?\d+)?$/u);
  const word = clean(m[1]), nth = +(m[2] || 1), useEnd = !!m[3], off = +(m[4] || 0);
  if (!word && m[4]) return after + off;
  const ws = W(); let seen = 0;
  // cho phép cụm nhiều từ: "sấy nhanh"
  const parts = String(m[1]).split(/\s+/).map(clean).filter(Boolean);
  for (let i = 0; i < ws.length; i++) {
    if (ws[i].s < after - 1e-6) continue;
    let ok = true; for (let j = 0; j < parts.length; j++) if (!ws[i + j] || !clean(ws[i + j].w).startsWith(parts[j])) { ok = false; break; }
    if (ok && ++seen === nth) return (useEnd ? ws[i + parts.length - 1].e : ws[i].s) + off;
  }
  throw new Error(`scenes.json: không tìm thấy từ "${spec}" sau giây ${after.toFixed(2)}`);
}

// ---------- biểu tượng động (vẽ trong ô ~150px, tâm cx,cy; s = tỉ lệ) ----------
const ICONS = {
  clothesline(cx, cy, t) {
    g.strokeStyle = C.navy; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx - 85, cy - 40); g.quadraticCurveTo(cx, cy - 20, cx + 85, cy - 40); g.stroke();
    [[-55, '#7aa7e0'], [0, '#f2a65a'], [53, '#9ccf8f']].forEach(([dx, col], i) => {
      g.save(); g.translate(cx + dx, cy - 30); g.rotate(Math.sin(t * 5 + i) * .06); g.fillStyle = col;
      g.beginPath(); g.moveTo(-20, 0); g.lineTo(20, 0); g.lineTo(26, 14); g.lineTo(16, 18); g.lineTo(16, 56); g.lineTo(-16, 56); g.lineTo(-16, 18); g.lineTo(-26, 14); g.closePath(); g.fill(); g.restore();
    });
    g.fillStyle = '#5b8fd6';
    for (let i = 0; i < 9; i++) { const ph = (t * 1.6 + i * .37) % 1; g.save(); g.globalAlpha *= .9 * (1 - ph); g.beginPath(); g.ellipse(cx - 80 + (i * 23) % 170, cy + 35 + ph * 40, 3, 8, 0, 0, 7); g.fill(); g.restore(); }
  },
  stack(cx, cy, t, it) {   // máy lật ngược rồi đặt lên nóc máy khác
    const box = (x, y, door) => { rr(x, y, 110, 92, 12); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 4; g.strokeStyle = C.navy; g.stroke(); g.fillStyle = C.soft; g.fillRect(x + 6, y + 6, 98, 14); g.beginPath(); g.arc(x + 55, y + 54, 26, 0, 7); g.lineWidth = 5; g.stroke(); g.fillStyle = door; g.beginPath(); g.arc(x + 55, y + 54, 18, 0, 7); g.fill(); };
    box(cx - 55, cy + 2, '#b9d3f0');
    const k = clamp((t - it._t0 - .25) / .8), e = eInOut(k);
    g.save(); g.translate(cx, cy - 46 - 60 * (1 - e)); g.rotate(Math.PI * (1 - e)); box(-55, -46, '#f5d7b5'); g.restore();
  },
  family(cx, cy, t, it) {
    [[-38, 18], [0, 22], [40, 15]].forEach(([dx, r], i) => {
      const b = bounce(clamp((t - it._t0 - i * .08) / .6)) * 10; g.fillStyle = i === 1 ? C.navy : '#7f8db5';
      g.beginPath(); g.arc(cx + dx, cy - 18 - b, r * .62, 0, 7); g.fill(); rr(cx + dx - r * .8, cy - 2 - b, r * 1.6, r * 1.7, r * .7); g.fill();
    });
  },
  drum(cx, cy, t, it) {   // lồng quay + mũi tên đảo chiều (đảo từ subAt)
    g.beginPath(); g.arc(cx, cy, 58, 0, 7); g.fillStyle = '#dfe4ec'; g.fill();
    g.fillStyle = '#9aa4b5'; for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + t; g.beginPath(); g.arc(cx + 32 * Math.cos(a), cy + 32 * Math.sin(a), 4, 0, 7); g.fill(); }
    const ts = it._sub ?? it._t0, ang = t < ts ? (t - it._t0) * 3 : 1.6 * Math.sin((t - ts) * Math.PI / .7);
    arrows(cx, cy, 70, ang);
  },
  drop(cx, cy, t, it) {   // mức nước giảm từ subAt tới stampAt
    const a = it._sub ?? it._t0, b = it._stamp ?? a + 1.4, f = 1 - eInOut(clamp((t - a) / Math.max(.4, b - a)));
    g.save(); g.beginPath(); g.moveTo(cx, cy - 78); g.bezierCurveTo(cx + 62, cy - 8, cx + 62, cy + 62, cx, cy + 62); g.bezierCurveTo(cx - 62, cy + 62, cx - 62, cy - 8, cx, cy - 78); g.closePath();
    g.fillStyle = '#e6eef9'; g.fill(); g.clip(); const lvl = cy + 62 - 140 * f, wv = Math.sin(t * 6) * 5;
    g.fillStyle = '#4f8fe0'; g.beginPath(); g.moveTo(cx - 80, lvl + wv); g.quadraticCurveTo(cx, lvl - wv * 2, cx + 80, lvl + wv); g.lineTo(cx + 80, cy + 80); g.lineTo(cx - 80, cy + 80); g.fill(); g.restore();
    txt(Math.round(f * 100) + '%', cx, cy + 30, 32, f > .45 ? '#fff' : C.navy, {al: 'center'});
  },
  shield(cx, cy, t, it) {
    const p = clamp((t - (it._sub ?? it._t0 + .3)) / .45) * 1.4;
    g.beginPath(); g.moveTo(cx, cy - 72); g.lineTo(cx + 60, cy - 48); g.lineTo(cx + 54, cy + 12); g.quadraticCurveTo(cx + 42, cy + 54, cx, cy + 74); g.quadraticCurveTo(cx - 42, cy + 54, cx - 54, cy + 12); g.lineTo(cx - 60, cy - 48); g.closePath(); g.fillStyle = C.green; g.fill();
    checkMark(cx, cy, 24, p, '#fff', 10);
    sparkles(cx, cy, t - it._t0, 90);
  },
  clock(cx, cy, t, it) {
    g.beginPath(); g.arc(cx, cy, 60, 0, 7); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 8; g.strokeStyle = C.navy; g.stroke();
    g.save(); g.translate(cx, cy); g.lineCap = 'round'; g.lineWidth = 7; g.strokeStyle = C.red;
    g.save(); g.rotate((t - it._t0) * 4); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -44); g.stroke(); g.restore();
    g.save(); g.rotate((t - it._t0) * .5); g.strokeStyle = C.navy; g.beginPath(); g.moveTo(0, 0); g.lineTo(28, 0); g.stroke(); g.restore(); g.restore();
  },
  snow(cx, cy, t) {
    g.save(); g.translate(cx, cy); g.rotate(t * .6); g.strokeStyle = '#3d8ee8'; g.lineWidth = 8; g.lineCap = 'round';
    for (let i = 0; i < 6; i++) { g.save(); g.rotate(i * Math.PI / 3); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -62); g.moveTo(0, -38); g.lineTo(-14, -52); g.moveTo(0, -38); g.lineTo(14, -52); g.stroke(); g.restore(); }
    g.restore();
  },
  wind(cx, cy, t) {
    g.strokeStyle = '#3d8ee8'; g.lineWidth = 8; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) { const ph = ((t * .9 + i * .33) % 1), y = cy - 36 + i * 36, len = 110 - i * 20;
      g.beginPath(); g.moveTo(cx - 70 + ph * 20, y); g.lineTo(cx - 70 + ph * 20 + len, y); g.arc(cx - 70 + ph * 20 + len, y - 14, 14, Math.PI / 2, -Math.PI * .9, true); g.stroke(); }
  },
  leaf(cx, cy, t) {
    g.save(); g.translate(cx, cy); g.rotate(Math.sin(t * 2) * .08);
    g.beginPath(); g.moveTo(-50, 50); g.bezierCurveTo(-60, -40, 20, -70, 60, -60); g.bezierCurveTo(60, 10, 10, 60, -50, 50); g.fillStyle = C.green; g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.moveTo(-46, 46); g.quadraticCurveTo(10, 0, 50, -50); g.stroke(); g.restore();
  },
  bolt(cx, cy, t) {
    const fl = .85 + .15 * Math.sin(t * 9);
    g.save(); g.translate(cx, cy); g.scale(fl, fl); g.beginPath(); g.moveTo(10, -70); g.lineTo(-40, 8); g.lineTo(-4, 8); g.lineTo(-14, 70); g.lineTo(40, -14); g.lineTo(4, -14); g.closePath(); g.fillStyle = '#f5b400'; g.fill(); g.restore();
  },
  wifi(cx, cy, t) {
    g.lineCap = 'round'; g.lineWidth = 10;
    for (let i = 0; i < 3; i++) { const on = ((t * 1.5) % 1.5) > i * .35; g.strokeStyle = on ? '#3d8ee8' : '#c9d6ea'; g.beginPath(); g.arc(cx, cy + 40, 30 + i * 28, -Math.PI * .78, -Math.PI * .22); g.stroke(); }
    g.fillStyle = '#3d8ee8'; g.beginPath(); g.arc(cx, cy + 40, 9, 0, 7); g.fill();
  },
  thermo(cx, cy, t, it) {
    rr(cx - 16, cy - 70, 32, 110, 16); g.fillStyle = '#eef1f6'; g.fill(); g.lineWidth = 5; g.strokeStyle = C.navy; g.stroke();
    const f = .3 + .5 * eInOut(clamp((t - it._t0) / 1.2)); g.fillStyle = C.red; rr(cx - 8, cy + 30 - 90 * f, 16, 90 * f, 8); g.fill();
    g.beginPath(); g.arc(cx, cy + 46, 26, 0, 7); g.fill(); g.lineWidth = 5; g.stroke();
  },
  star(cx, cy, t) {
    g.save(); g.translate(cx, cy); g.rotate(Math.sin(t * 2) * .1); g.beginPath();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? 28 : 66, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(r * Math.cos(a), r * Math.sin(a)); }
    g.closePath(); g.fillStyle = '#f5b400'; g.fill(); g.restore();
  },
  sparkle(cx, cy, t, it) { sparkles(cx, cy, t - it._t0, 60, 8, true); },
  sound(cx, cy, t) {
    g.fillStyle = C.navy; g.beginPath(); g.moveTo(cx - 60, cy - 20); g.lineTo(cx - 34, cy - 20); g.lineTo(cx - 4, cy - 48); g.lineTo(cx - 4, cy + 48); g.lineTo(cx - 34, cy + 20); g.lineTo(cx - 60, cy + 20); g.closePath(); g.fill();
    g.strokeStyle = C.red; g.lineWidth = 8; g.lineCap = 'round';
    for (let i = 0; i < 3; i++) { const on = ((t * 1.6) % 1.2) > i * .3; if (!on) continue; g.beginPath(); g.arc(cx - 4, cy, 22 + i * 20, -Math.PI / 4, Math.PI / 4); g.stroke(); }
  },
  check(cx, cy, t, it) { g.beginPath(); g.arc(cx, cy, 60, 0, 7); g.fillStyle = C.red; g.fill(); checkMark(cx, cy, 26, clamp((t - it._t0 - .2) / .35), '#fff', 12); },
  home(cx, cy, t, it) {
    const b = bounce(clamp((t - it._t0) / .6)) * 8;
    g.fillStyle = C.navy; g.beginPath(); g.moveTo(cx, cy - 66 - b); g.lineTo(cx + 70, cy - 6 - b); g.lineTo(cx - 70, cy - 6 - b); g.closePath(); g.fill();
    rr(cx - 50, cy - 8, 100, 72, 6); g.fill(); g.fillStyle = C.yel; rr(cx - 14, cy + 22, 28, 42, 4); g.fill();
  },
  fire(cx, cy, t) {
    const f = 1 + .08 * Math.sin(t * 11) + .05 * Math.sin(t * 17);
    g.save(); g.translate(cx, cy + 50); g.scale(1, f);
    g.beginPath(); g.moveTo(0, -120); g.bezierCurveTo(60, -60, 50, 0, 0, 0); g.bezierCurveTo(-50, 0, -60, -60, 0, -120); g.fillStyle = '#ff7a1a'; g.fill();
    g.beginPath(); g.moveTo(0, -70); g.bezierCurveTo(30, -40, 26, 0, 0, 0); g.bezierCurveTo(-26, 0, -30, -40, 0, -70); g.fillStyle = C.yel; g.fill(); g.restore();
  },
  screen(cx, cy, t) {
    rr(cx - 72, cy - 50, 144, 92, 10); g.fillStyle = C.navy; g.fill();
    const gr = g.createLinearGradient(cx - 64, 0, cx + 64, 0); const h = (t * 60) % 360;
    gr.addColorStop(0, `hsl(${h},80%,60%)`); gr.addColorStop(1, `hsl(${(h + 120) % 360},80%,60%)`);
    g.fillStyle = gr; rr(cx - 64, cy - 42, 128, 76, 6); g.fill(); g.fillStyle = C.navy; g.fillRect(cx - 24, cy + 46, 48, 10);
  },
  fridge(cx, cy, t, it) {
    rr(cx - 44, cy - 74, 88, 148, 12); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 5; g.strokeStyle = C.navy; g.stroke();
    g.beginPath(); g.moveTo(cx - 44, cy - 20); g.lineTo(cx + 44, cy - 20); g.stroke(); g.fillStyle = C.navy; g.fillRect(cx + 26, cy - 60, 6, 26); g.fillRect(cx + 26, cy - 6, 6, 34);
    g.save(); g.translate(cx + 52, cy - 62); g.scale(.4, .4); ICONS.snow(0, 0, t); g.restore();
  },
  shirt(cx, cy, t) {
    g.save(); g.translate(cx, cy - 50); g.rotate(Math.sin(t * 3) * .05); g.scale(2, 2); g.fillStyle = '#7aa7e0';
    g.beginPath(); g.moveTo(-20, 0); g.lineTo(20, 0); g.lineTo(26, 14); g.lineTo(16, 18); g.lineTo(16, 56); g.lineTo(-16, 56); g.lineTo(-16, 18); g.lineTo(-26, 14); g.closePath(); g.fill(); g.restore();
    sparkles(cx, cy, t, 70);
  },

// ---------- phụ đề karaoke nảy (bật bằng project.json: "subtitles": true) ----------
const SUBFONT = 58, LH = 74, MAXW = 820, SUBCX = (SAFE.x0 + SAFE.x1) / 2;

function buildCues() {
  font(SUBFONT, 800, 'Hepta'); const sp = g.measureText(' ').width, ws0 = W();
  KEY = new Set((CFG.subtitleKeywords || []).map(clean));
  const width = (arr) => arr.reduce((a, w) => a + w.width, 0) + sp * Math.max(0, arr.length - 1);
  for (const seg of WD.segs) {
    const ws = ws0.slice(seg.w0, seg.w1).map((w) => ({...w, width: g.measureText(w.w).width}));
    const nLines = Math.ceil(width(ws) / (MAXW * .92)), nChunks = Math.max(1, Math.ceil(nLines / 2)); const chunks = []; let start = 0;
    for (let c = 0; c < nChunks; c++) { if (c === nChunks - 1) { chunks.push(ws.slice(start)); break; }
      const target = width(ws) * (c + 1) / nChunks; let end = start + 1; while (end < ws.length - 1 && width(ws.slice(0, end + 1)) <= target) end++; chunks.push(ws.slice(start, end)); start = end; }
    for (const ch of chunks) { if (width(ch) <= MAXW * .92 || ch.length < 2) { CUES.push({lines: [ch]}); continue; }
      let best = 1, bw = 1e9; for (let k = 1; k < ch.length; k++) { const m = Math.max(width(ch.slice(0, k)), width(ch.slice(k))); if (m < bw) { bw = m; best = k; } }
      CUES.push({lines: [ch.slice(0, best), ch.slice(best)]}); }
  }
  CUES.forEach((c) => { const all = c.lines.flat(); c.s = all[0].s - .12; c.e = all[all.length - 1].e; c.lines.forEach((ln) => { ln.w = width(ln); ln.sp = sp; }); });
  CUES.forEach((c, i) => { const nx = CUES[i + 1]; c.hide = nx ? Math.min(nx.s, c.e + .7) : c.e + 3; });
}

  g.save(); g.globalAlpha = 1 - pout; font(SUBFONT, 800, 'Hepta'); g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.lineJoin = 'round';
  c.lines.forEach((ln, li) => { let x = SUBCX - ln.w / 2; const y = baseY + li * LH;
    ln.forEach((w, wi) => { const said = t >= w.s, ein = back(clamp((t - c.s - (li * 3 + wi) * .025) / .28), 2.2), b = bounce(clamp((t - w.s) / .42));
      const sc = ein * (1 + .22 * b), cx = x + w.width / 2;
      g.save(); g.translate(cx, y - 16 * b); g.scale(sc, sc); g.translate(-cx, 0);
      g.lineWidth = 12; g.strokeStyle = 'rgba(8,10,24,.92)'; g.strokeText(w.w, x, 0); g.fillStyle = said ? (KEY.has(clean(w.w)) ? '#ff5a3c' : C.yel) : '#fff'; g.fillText(w.w, x, 0); g.restore();
      x += w.width + ln.sp; }); });
  g.restore();
}

function drawSafe() {
  g.save(); g.fillStyle = 'rgba(255,0,0,.28)'; g.fillRect(0, 0, 1080, SAFE.y0); g.fillRect(0, 1440, 1080, 480); g.fillRect(SAFE.x1, SAFE.y0, 140, 1440 - SAFE.y0); g.fillRect(0, SAFE.y0, SAFE.x0, 1440 - SAFE.y0);
  g.strokeStyle = 'lime'; g.lineWidth = 3; g.strokeRect(SAFE.x0, SAFE.y0, SAFE.x1 - SAFE.x0, SAFE.y1 - SAFE.y0); g.strokeStyle = 'yellow'; g.strokeRect(SAFE.x0, SUB.y0, SAFE.x1 - SAFE.x0, 1440 - SUB.y0); g.restore();
}

// ---------- cú mở đầu (project.json "intro") ----------
// 0 → BOOM: hình tối dần + tiếng rít dồn lên; BOOM: chớp trắng, rung, tiêu đề đập vào; lời dẫn vào ngay sau.
let INTRO = null;   // {boom, flash, shake}
function introPre(t) {
  if (!INTRO || t >= INTRO.boom) return;
  const k = clamp(t / INTRO.boom);
  g.save(); const gr = g.createRadialGradient(540, 960, 200, 540, 960, 1150);
  gr.addColorStop(0, `rgba(0,0,0,${.15 * k})`); gr.addColorStop(1, `rgba(0,0,0,${.75 * k})`);
  g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920); g.restore();
}
function introShake(t) {
  if (!INTRO || !INTRO.shake || t < INTRO.boom) return [0, 0];
  const P = Math.exp(-7 * (t - INTRO.boom)); if (P < .02) return [0, 0];
  return [16 * P * Math.sin(t * 95), 12 * P * Math.cos(t * 83)];
}
function introFlash(t) {
  if (!INTRO || !INTRO.flash || t < INTRO.boom) return;
  const k = (t - INTRO.boom) / .25; if (k >= 1) return;
  g.save(); g.fillStyle = `rgba(255,255,255,${.9 * (1 - eOut(k))})`; g.fillRect(0, 0, 1080, 1920); g.restore();
}

// ---------- khởi tạo + vẽ ----------
let ITEMS = [];
function prepScenes() {
  let prev = 0;
  ITEMS = SCENES.map((s, i) => ({...s, _i: i}));
  for (const it of ITEMS) {
    if (!TYPES[it.type]) throw new Error(`scenes.json: loại "${it.type}" không có. Có: ${Object.keys(TYPES).join(', ')}`);
    it._t0 = resolve(it.at, prev); prev = it._t0;
  }
  if (INTRO && ITEMS[0] && ITEMS[0].type === 'title') { ITEMS[0]._t0 = Math.max(ITEMS[0]._t0, INTRO.boom); }
  // until mặc định: lúc thành phần sau (cùng hàng hoặc hàng trên) xuất hiện
  ITEMS.forEach((it, i) => {
    if (it.type === 'chip' && !it.row) it.row = 2;
    if (it.until !== undefined) return;
    const nx = ITEMS.slice(i + 1).find((o) => (o.row || (o.type === 'chip' ? 2 : 1)) <= (it.row || 1));
    it._t1 = nx ? nx._t0 - .1 : CFG.duration + 1;
  });
  ITEMS.forEach((it) => { TYPES[it.type].prep(it); if (it._t1 === undefined) it._t1 = typeof it.until === 'number' && it.until > 900 ? CFG.duration + 1 : resolve(it.until, it._t0); });
}
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.setLineDash([]); g.shadowBlur = 0; g.shadowColor = 'transparent'; g.letterSpacing = '0px'; g.lineCap = 'butt'; g.lineJoin = 'miter';
  g.clearRect(0, 0, 1080, 1920);
  introPre(t);
  watermark();
  const [sx, sy] = introShake(t); g.save(); g.translate(sx, sy);
  for (const it of ITEMS) { const L = life(t, it._t0, it._t1, it.type === 'title' ? (it._slam ? .05 : .38) : .42); if (L) TYPES[it.type].draw(it, t, L); }
  g.restore();
  introFlash(t);
  drawSubs(t);
  if (DEBUG) drawSafe();
}
window.seek = (t) => render(t);
window.init = async () => {
  try {
    if (CFG.brand && CFG.brand.colors) C = {...C, ...CFG.brand.colors};
    if (CFG.intro && CFG.intro.enabled && CFG.intro.boom > 0) INTRO = {boom: CFG.intro.boom, flash: CFG.intro.flash !== false, shake: CFG.intro.shake !== false};
    await Promise.all(['800 58px Hepta', '800 40px BVP', '600 40px BVP'].map((f) => document.fonts.load(f, 'Tạm biệt ĐIỆN MÁY ữ')));
    if (CFG.logo) await new Promise((r) => { LOGO.onload = () => { LOGO_OK = true; r(); }; LOGO.onerror = () => r(); LOGO.src = CFG.logo; });
    prepScenes(); buildCues(); SFX.sort((a, b) => a.t - b.t);
    window.SFX = SFX; window.TIMES = ITEMS.map((it) => ({type: it.type, from: +it._t0.toFixed(2), to: +Math.min(it._t1, CFG.duration).toFixed(2)}));
    render(0); window.ready = true;
  } catch (e) { window.err = String(e && e.message || e); }
};
